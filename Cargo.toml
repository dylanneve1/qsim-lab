[package]
name = "qsim-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "An educational quantum circuit simulator with state-vector, stabilizer, Pauli-path (Clifford+T) and MPS backends"
repository = "https://github.com/dylanneve1/qsim-lab"
readme = "README.md"
# Integration tests live in tests/<area>/<name>.rs and are listed as [[test]]
# targets below (binary name = file name, so `cargo test --test <name>` and
# tools/ci_shard.py keep working). Top-level tests/*.rs files are still
# auto-discovered (tools/autoimprove drops its gate test there).
keywords = ["quantum", "simulator", "stabilizer", "mps"]
categories = ["science", "simulation"]
# Lab notebooks and their data stay in the repository, not in packages (crate
# or the qsimlab sdist, which packages this crate as a path dependency).
exclude = ["research/", "tools/", "*.sh"]

[workspace]
members = [".", "python"]
# `cargo build/test/clippy` in the root still act on the engine crate only;
# the Python extension needs a Python interpreter to build (see python/).
default-members = ["."]

[lib]
name = "qsim_lab"
path = "src/lib.rs"

[[bin]]
name = "qsim"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
num-complex = "0.4"
num-traits = "0.2"
rand = "0.9"
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.32", optional = true }

[features]
# Apple-GPU (Metal) f32 state-vector backend, `qsim_lab::metal_sv`. Only has
# an effect on macOS; other targets build exactly as without it.
metal = ["dep:metal"]

[[example]]
name = "metal_bench"
required-features = ["metal"]

