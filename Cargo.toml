[package]
name = "qsim-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "An educational quantum circuit simulator with state-vector, stabilizer, Pauli-path (Clifford+T) and MPS backends"
repository = "https://github.com/dylanneve1/qsim-lab"
readme = "README.md"
keywords = ["quantum", "simulator", "stabilizer", "mps"]
categories = ["science", "simulation"]

[lib]
name = "qsim_lab"
path = "src/lib.rs"

[[bin]]
name = "qsim"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
num-complex = "0.4"
num-traits = "0.2"
rand = "0.9"
rayon = "1"

[dev-dependencies]
proptest = "1"

# Tests exercise SVDs and 20-qubit state vectors; keep them reasonably quick
# without having to build everything in release mode.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4
