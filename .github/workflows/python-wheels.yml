name: Python wheels

# Builds abi3 wheels (CPython >= 3.9) of the `qsimlab` package for Linux
# x86_64 / aarch64 (manylinux) and macOS arm64, plus an sdist, then installs
# each wheel and runs the Python test-suite against it. Publishing is a
# separate, manual step (not part of this workflow).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "python/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            manylinux: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
          sccache: "true"
      - name: Check wheel tags (abi3)
        shell: bash
        run: |
          ls -l python/dist
          ls python/dist/*.whl | grep -q 'cp39-abi3' || { echo "wheel is not abi3"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  test:
    name: test ${{ matrix.platform }} / py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest and newest supported CPython on the same abi3 wheel
          - { platform: linux-x86_64, runner: ubuntu-latest, python: "3.9", extras: "" }
          - { platform: linux-x86_64, runner: ubuntu-latest, python: "3.12", extras: "qiskit qiskit-aer cirq-core stim" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.12", extras: "stim" }
          - { platform: macos-arm64, runner: macos-14, python: "3.12", extras: "stim" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest ${{ matrix.extras }}
      - name: Tests (against the installed wheel)
        shell: bash
        env:
          RAYON_NUM_THREADS: "2"
        run: |
          python -m pytest python/tests -q
          python -m pytest -q --doctest-modules --pyargs qsimlab -o doctest_optionflags="NORMALIZE_WHITESPACE ELLIPSIS NUMBER"
