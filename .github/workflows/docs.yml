name: docs
on:
  push: { branches: [main] }
  pull_request: { paths: ["python/**", "mkdocs.yml", "scripts/docs-assemble.sh", "scripts/griffe_rst.py", ".github/workflows/docs.yml"] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "mkdocs<2" mkdocs-material "mkdocstrings[python]" ruff
      - run: scripts/docs-assemble.sh && mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
